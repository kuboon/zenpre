name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno environment
        uses: denoland/setup-deno@v2
      - name: get denoDir
        run: echo "denoDir=$(deno info --json | jq -r .denoDir)/*" >> "$GITHUB_OUTPUT"
        id: deno-dir
      - name: Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.deno-dir.outputs.denoDir }}
          key: ${{ runner.os }}-deno
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - name: publish dry-run (@kuboon/zenpre)
        run: deno publish --dry-run --allow-slow-types
        working-directory: packages/zenpre
